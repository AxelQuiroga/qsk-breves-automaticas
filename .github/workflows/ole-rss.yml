name: Actualizar feed RSS de Olé

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: actualizar-feed-ole
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Descargar repositorio del extractor
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar contratos y código
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint

      - name: Descargar, validar y generar el feed
        run: pnpm ole

      - name: Validar el contrato del JSON generado
        run: node scripts/validar-feed-ole.ts data/ole-noticias.json

      # El feed se entrega al repositorio del sitio, siguiendo el mecanismo
      # de gacetillas. Solo main puede abrir o actualizar el PR automatizado.
      - name: Descargar QSK Noticias
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: AxelQuiroga/QSK-Noticias
          ref: master
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias

      - name: Copiar feed validado a QSK Noticias
        if: github.ref == 'refs/heads/main'
        run: cp data/ole-noticias.json qsk-noticias/src/data/ole.json

      - name: Crear o actualizar PR de Olé en QSK Noticias
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias
          branch: automation/ole-rss
          base: master
          delete-branch: false
          add-paths: src/data/ole.json
          commit-message: "chore(ole): actualizar feed RSS"
          title: "chore(ole): actualizar noticias de Olé"
          body: |
            Actualización automática del feed RSS de Olé.

            - Destino: `src/data/ole.json`
            - Fuente: https://www.ole.com.ar/rss/ultimas-noticias/
            - Se incluyen metadatos y enlaces originales, no el texto completo de los artículos.
            - Este PR solo modifica el archivo del feed de Olé; no toca las gacetillas oficiales.

            Revisar los cambios antes de fusionar.
