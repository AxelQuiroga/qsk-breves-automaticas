
name: Actualizar gacetillas oficiales

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: actualizar-gacetillas
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    container:
      image: ghcr.io/axelquiroga/qsk-breves-automaticas:runtime-1.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Descargar repositorio del extractor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # curl-impersonate se instala en el contenedor de esta corrida; no cambia
      # la imagen runtime ni el calendario del workflow. Solo lo usa Lanús si fetch da 403.
      - name: Instalar curl-impersonate para el fallback de Lanús
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates tar

          VERSION="2.3.0"
          ARCHIVE="curl-impersonate-v${VERSION}.x86_64-linux-gnu.tar.gz"
          URL="https://github.com/lexiforest/curl-impersonate/releases/download/v${VERSION}/${ARCHIVE}"

          curl --fail --silent --show-error --location \
            "$URL" --output "/tmp/${ARCHIVE}"

          echo "Verificando SHA-256 del archivo descargado..."
          echo "5e77cb12217158f118ead21ab550791788e553fb140d03a49d74d08308ebdb06  /tmp/${ARCHIVE}" \
            | sha256sum --check

          mkdir -p /opt/curl-impersonate
          tar -xzf "/tmp/${ARCHIVE}" -C /opt/curl-impersonate

          WRAPPER="$(find /opt/curl-impersonate -type f -name curl_chrome152 -print -quit)"
          test -n "$WRAPPER"

          chmod +x "$WRAPPER"
          echo "$(dirname "$WRAPPER")" >> "$GITHUB_PATH"

          echo "Ejecutable encontrado: $WRAPPER"
          "$WRAPPER" --version

      # El contenedor ya aporta Node, pnpm y el entorno TLS.
      # Instalamos las dependencias del checkout para trabajar
      # sobre el código de la rama ejecutada.
      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Verificar extractor
        run: |
          pnpm test
          pnpm typecheck

      # Permite procesar los datos sanos y preparar la PR aunque
      # alguna fuente falle. El job se marcará como fallido al final.
      - name: Extraer y combinar gacetillas con el historial
        id: extraer
        continue-on-error: true
        run: pnpm extraer

      - name: Registrar estado de la corrida
        id: estado
        if: always()
        run: |
          ESTADO=$(node -p "JSON.parse(require('fs').readFileSync('data/estado-corrida.json','utf8')).estado" 2>/dev/null || echo falla-total)
          echo "estado=$ESTADO" >> "$GITHUB_OUTPUT"
          echo "Estado de la corrida: $ESTADO"

      - name: Validar resultado antes de persistir o preparar la PR
        if: steps.estado.outputs.estado != 'falla-total'
        run: node scripts/validar.mjs

      # En schedule actualiza main del extractor.
      # En workflow_dispatch conserva la rama seleccionada.
      
      - name: Guardar historial en el repositorio del extractor
        if: steps.estado.outputs.estado != 'falla-total'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gacetillas-historial.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update official gacetillas history"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "El historial no cambió."
          fi


      - name: Descargar QSK Noticias
        if: steps.estado.outputs.estado != 'falla-total'
        uses: actions/checkout@v4
        with:
          repository: AxelQuiroga/QSK-Noticias
          ref: master
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias

      - name: Copiar datos extraídos
        if: steps.estado.outputs.estado != 'falla-total'
        run: cp data/gacetillas.json qsk-noticias/src/data/gacetillas.json

      - name: Generar cuerpo de la PR (estado por fuente)
        if: steps.estado.outputs.estado != 'falla-total'
        run: node scripts/generar-body-pr.mjs qsk-noticias/.pr-body.md

      - name: Crear o actualizar PR en QSK Noticias
        if: steps.estado.outputs.estado != 'falla-total'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias
          branch: automation/gacetillas-oficiales
          delete-branch: false
          add-paths: src/data/gacetillas.json
          commit-message: "chore: update official gacetillas"
          title: "chore: actualizar gacetillas oficiales (GBA y municipios)"
          body-path: qsk-noticias/.pr-body.md

      # Primero se guarda el resultado parcial y se prepara la PR;
      # después se informa el error para que Actions lo registre.
      - name: Marcar el job como fallido por fuentes con error
        if: always() && steps.extraer.outcome == 'failure'
        run: |
          echo "La corrida de extracción terminó con errores (revisar el paso 'Extraer')."
          echo "La PR en QSK y el historial del extractor ya reflejan el resultado parcial con los datos de las fuentes sanas."
          exit 1
