name: Actualizar gacetillas oficiales

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: actualizar-gacetillas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio del extractor (main en schedule, rama de prueba en dispatch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Actualizar certificados del sistema TLS (solución Avellaneda)
        run: sudo apt-get update -qq && sudo apt-get install -y ca-certificates && sudo update-ca-certificates

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Verificar extractor
        run: |
          pnpm test
          pnpm typecheck

      # La extracción puede terminar en parcial (alguna fuente falló y las
      # sanas aportaron datos): exit 2 + estado en data/estado-corrida.json.
      # continue-on-error permite validar/persistir/PR con el resultado parcial;
      # el último paso vuelve a marcar el job como fallido DESPUÉS de la PR.
      - name: Extraer y combinar gacetillas con el historial
        id: extraer
        continue-on-error: true
        run: pnpm extraer

      - name: Registrar estado de la corrida
        id: estado
        if: always()
        run: |
          ESTADO=$(node -p "JSON.parse(require('fs').readFileSync('data/estado-corrida.json','utf8')).estado" 2>/dev/null || echo falla-total)
          echo "estado=$ESTADO" >> "$GITHUB_OUTPUT"
          echo "Estado de la corrida: $ESTADO"

      # Rechaza falla-total, en-curso (crash a mitad), y todo dataset inválido:
      # fuente requerida y consistente con el dominio, URLs/slugs únicos,
      # preservación del historial por fuente. Sin mínimo universal de 12.
      - name: Validar resultado antes de persistir o preparar la PR
        if: steps.estado.outputs.estado != 'falla-total'
        run: node scripts/validar.mjs

      # En schedule, github.ref_name = main (push a main igual que antes).
      # En dispatch desde una rama de prueba, empuja a ESA rama: no toca main.
      - name: Guardar historial en el repositorio del extractor
        if: steps.estado.outputs.estado != 'falla-total'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gacetillas-historial.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update official gacetillas history"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "El historial no cambió."
          fi

      - name: Descargar QSK Noticias
        if: steps.estado.outputs.estado != 'falla-total'
        uses: actions/checkout@v4
        with:
          repository: AxelQuiroga/QSK-Noticias
          ref: master
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias

      - name: Copiar datos extraídos
        if: steps.estado.outputs.estado != 'falla-total'
        run: cp data/gacetillas.json qsk-noticias/src/data/gacetillas.json

      - name: Generar cuerpo de la PR (estado por fuente)
        if: steps.estado.outputs.estado != 'falla-total'
        run: node scripts/generar-body-pr.mjs qsk-noticias/.pr-body.md

      - name: Crear o actualizar PR en QSK Noticias
        if: steps.estado.outputs.estado != 'falla-total'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias
          branch: automation/gacetillas-oficiales
          delete-branch: false
          add-paths: src/data/gacetillas.json
          commit-message: "chore: update official gacetillas"
          title: "chore: actualizar gacetillas oficiales (GBA y municipios)"
          body-path: qsk-noticias/.pr-body.md

      # Con falla parcial la PR ya se creó/actualizó y el historial ya se
      # guardó; recién acá se marca el job como fallido.
      - name: Marcar el job como fallido por fuentes con error
        if: always() && steps.extraer.outcome == 'failure'
        run: |
          echo "La corrida de extracción terminó con errores (revisar el paso 'Extraer')."
          echo "La PR en QSK y el historial del extractor ya reflejan el resultado parcial con los datos de las fuentes sanas."
          exit 1

