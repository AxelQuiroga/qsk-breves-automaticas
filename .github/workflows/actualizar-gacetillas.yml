name: Actualizar gacetillas oficiales

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: actualizar-gacetillas-gba
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio del extractor
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Verificar extractor
        run: |
          pnpm test
          pnpm typecheck

      - name: Extraer y combinar gacetillas con el historial
        run: pnpm extraer

      - name: Validar resultado antes de persistir o preparar la PR
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const noticias = JSON.parse(readFileSync("data/gacetillas.json", "utf8"));
            if (!Array.isArray(noticias) || noticias.length < 10) {
              throw new Error("Resultado incompleto: se requieren al menos 10 gacetillas combinadas. No se actualizará el historial ni QSK.");
            }
            if (noticias.length > 12) {
              throw new Error("El resultado superó el máximo de 12 gacetillas.");
            }
            const urls = noticias.map((noticia) => noticia.urlNoticia);
            if (urls.some((url) => typeof url !== "string" || !url.startsWith("https://www.gba.gob.ar/"))) {
              throw new Error("Hay URLs inválidas o fuera del dominio oficial. No se actualizará QSK.");
            }
            if (new Set(urls).size !== urls.length) {
              throw new Error("El resultado contiene URLs duplicadas.");
            }
            console.log("Resultado validado: " + noticias.length + " gacetillas.");
          '

      - name: Guardar historial en el repositorio del extractor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gacetillas-historial.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update official gacetillas history"
            git push origin HEAD:main
          else
            echo "El historial no cambió."
          fi

      - name: Descargar QSK Noticias
        uses: actions/checkout@v4
        with:
          repository: AxelQuiroga/QSK-Noticias
          ref: master
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias

      - name: Copiar datos extraídos
        run: cp data/gacetillas.json qsk-noticias/src/data/gacetillas.json

      - name: Crear o actualizar PR en QSK Noticias
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.QSK_NOTICIAS_TOKEN }}
          path: qsk-noticias
          branch: automation/gacetillas-oficiales
          delete-branch: false
          add-paths: src/data/gacetillas.json
          commit-message: "chore: update official Buenos Aires gacetillas"
          title: "chore: actualizar gacetillas oficiales de la Provincia"
          body: |
            Actualización automática de las últimas 12 gacetillas del Gobierno de la Provincia de Buenos Aires.

            - Se combinan las publicaciones detectadas con el historial persistido del extractor.
            - Se eliminan duplicados por URL original y se conservan hasta 12 gacetillas.
            - Cada tarjeta conserva su enlace a la publicación original.
            - Revisar la extracción antes de fusionar.
